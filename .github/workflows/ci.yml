name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install Hurl
        run: |
          curl -LO https://github.com/Orange-OpenSource/hurl/releases/download/8.1.0/hurl_8.1.0_amd64.deb
          sudo apt-get install -y ./hurl_8.1.0_amd64.deb
      # One apt-get update and no recommends: GitHub's Ubuntu mirror is
      # sometimes slow enough that two updates plus ffmpeg's recommends
      # took 27 minutes.
      - name: Install ffmpeg and native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg cmake libclang-dev libopus-dev ninja-build pkg-config
      - name: Run backend CI
        run: env -u FERROTUNE_DATABASE_URL moon run ferrotune:ci${{ matrix.database == 'postgres' && '-postgres' || '' }}

  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install ffmpeg and native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg cmake google-chrome-stable libclang-dev libopus-dev ninja-build pkg-config
      - name: Run client CI
        run: env -u FERROTUNE_DATABASE_URL moon run client:ci
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-artifacts
          path: |
            client/playwright-report/
            client/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android-native:
    name: Android (native)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Android unit tests and lint
        run: nix develop .#android -c moon run android:test-unit android:lint
      - name: Check Kotlin DTO bindings are current
        run: |
          nix develop .#android -c moon run android:generate-bindings
          git diff --exit-code -- android/core/network/src/main/java/com/ferrotune/core/network/generated
      - name: Build debug APK
        run: nix develop .#android -c moon run android:assemble-debug

  android-native-release:
    name: Android native APK
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - prepare-app-release
    env:
      FERROTUNE_ASSET_VERSION: ${{ needs.prepare-app-release.outputs.asset_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release APK
        run: nix develop .#android -c moon run android:assemble-release
      - name: Sign release APK
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p app-release/android-native
          nix develop .#android -c bash .github/scripts/sign-android-apk.sh \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "app-release/android-native/ferrotune-native-${FERROTUNE_ASSET_VERSION}.apk"
      - name: Upload Android native APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferrotune-native-android-${{ needs.prepare-app-release.outputs.asset_version }}
          path: app-release/android-native/*.apk
          if-no-files-found: error
          retention-days: 14

  build-image:
    name: Build & (optionally) push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only publish (and deploy) an image whose backend checks (unit tests and
    # the Hurl API suite against SQLite and Postgres) passed. The client E2E
    # suite still has intermittent multi-session flakes, so it does not gate
    # deploys yet.
    needs:
      - backend
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev libopus-dev ninja-build pkg-config

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Build Vite client
        run: moon run client:build-export

      - name: Build binary (musl)
        run: moon run ferrotune:build-release-musl

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to homelab
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
          repository: FruitieX/homelab
          event-type: image-update
          client-payload: |
            {
              "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",
              "digest": "${{ steps.build.outputs.digest }}",
              "revision": "${{ github.sha }}"
            }

  prepare-app-release:
    name: Prepare app release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      asset_version: ${{ steps.metadata.outputs.asset_version }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      release_name: ${{ steps.metadata.outputs.release_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: metadata
        name: Prepare metadata
        run: bash .github/scripts/prepare-app-release-metadata.sh

  android-app:
    name: Android APK
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - prepare-app-release
    env:
      FERROTUNE_APP_VERSION_NAME: ${{ needs.prepare-app-release.outputs.version_name }}
      FERROTUNE_ANDROID_VERSION_CODE: ${{ needs.prepare-app-release.outputs.version_code }}
      FERROTUNE_ASSET_VERSION: ${{ needs.prepare-app-release.outputs.asset_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare Tauri Android CI config
        run: bash .github/scripts/write-tauri-ci-config.sh client/tauri.android-ci.conf.json
      - name: Build Android APK
        run: nix develop .#android -c moon run client:tauri-android-build-ci
      - name: Sign Android APK
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p app-release/android
          nix develop .#android -c bash .github/scripts/sign-android-apk.sh \
            client/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk \
            "app-release/android/ferrotune-android-universal-${FERROTUNE_ASSET_VERSION}.apk"
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferrotune-android-${{ needs.prepare-app-release.outputs.asset_version }}
          path: app-release/android/*.apk
          if-no-files-found: error
          retention-days: 14

  desktop-app:
    name: Desktop app (${{ matrix.platform }})
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs:
      - prepare-app-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-latest
    env:
      FERROTUNE_APP_VERSION_NAME: ${{ needs.prepare-app-release.outputs.version_name }}
      FERROTUNE_ANDROID_VERSION_CODE: ${{ needs.prepare-app-release.outputs.version_code }}
      FERROTUNE_ASSET_VERSION: ${{ needs.prepare-app-release.outputs.asset_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            client/src-tauri -> target
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            ffmpeg \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            libgtk-3-dev \
            libopus-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            ninja-build \
            patchelf \
            pkg-config \
            wget
      - name: Install Windows desktop dependencies
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          choco install cmake llvm ffmpeg ninja -y
          {
            printf '%s\n' 'LIBCLANG_PATH=C:\Program Files\LLVM\bin'
            printf '%s\n' 'CMAKE_POLICY_VERSION_MINIMUM=3.5'
            printf '%s\n' 'CMAKE_GENERATOR=Visual Studio 17 2022'
            printf '%s\n' 'CMAKE_GENERATOR_PLATFORM=x64'
          } >> "$GITHUB_ENV"
      - name: Install macOS desktop dependencies
        if: matrix.platform == 'macos'
        run: |
          brew install cmake ffmpeg llvm ninja opus pkg-config
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Prepare Tauri desktop CI config
        shell: bash
        run: bash .github/scripts/write-tauri-ci-config.sh client/tauri.ci.conf.json
      - name: Build desktop app
        shell: bash
        run: moon run client:tauri-build-release-ci
      - name: Collect desktop artifacts
        shell: bash
        run: |
          bash .github/scripts/collect-tauri-artifacts.sh \
            client/src-tauri/target/release/bundle \
            app-release/desktop \
            "${{ matrix.platform }}" \
            "${FERROTUNE_ASSET_VERSION}"
      - name: Upload desktop artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferrotune-desktop-${{ matrix.platform }}-${{ needs.prepare-app-release.outputs.asset_version }}
          path: app-release/desktop/*
          if-no-files-found: error
          retention-days: 14

  publish-app-release:
    name: Publish app prerelease
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - prepare-app-release
      - android-app
      - android-native-release
      - desktop-app
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FERROTUNE_APP_VERSION_NAME: ${{ needs.prepare-app-release.outputs.version_name }}
      FERROTUNE_ANDROID_VERSION_CODE: ${{ needs.prepare-app-release.outputs.version_code }}
      FERROTUNE_ASSET_VERSION: ${{ needs.prepare-app-release.outputs.asset_version }}
      FERROTUNE_RELEASE_TAG: ${{ needs.prepare-app-release.outputs.tag_name }}
      FERROTUNE_RELEASE_NAME: ${{ needs.prepare-app-release.outputs.release_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download app artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ferrotune-*-${{ needs.prepare-app-release.outputs.asset_version }}
          path: app-release/assets
          merge-multiple: true
      - name: Write release notes
        run: bash .github/scripts/write-app-release-notes.sh app-release/release-notes.md
      - name: Publish prerelease
        run: |
          if gh release view "$FERROTUNE_RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$FERROTUNE_RELEASE_TAG" --yes --cleanup-tag
          fi

          mapfile -t assets < <(find app-release/assets -type f | sort)
          if (( ${#assets[@]} == 0 )); then
            echo "No app release assets were downloaded" >&2
            exit 1
          fi

          gh release create "$FERROTUNE_RELEASE_TAG" \
            "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "$FERROTUNE_RELEASE_NAME" \
            --notes-file app-release/release-notes.md \
            --prerelease
      - name: Remove old app prereleases
        run: bash .github/scripts/cleanup-app-prereleases.sh 10
