# Moon project configuration for the native Android client
# https://moonrepo.dev/docs/config/project

$schema: "https://moonrepo.dev/schemas/project.json"

project:
  name: "ferrotune-android"
  description: "Native Android client (Kotlin + Jetpack Compose)"
  channel: "#ferrotune"

fileGroups:
  sources:
    - "app/src/**/*"
    - "core/**/src/**/*"
    - "feature/**/src/**/*"
    - "**/*.gradle.kts"
    - "**/*.pro"
    - "gradle/libs.versions.toml"
    - "gradle.properties"
    - "settings.gradle.kts"

tasks:
  # ============================================================================
  # CODE GENERATION
  # ============================================================================

  generate-bindings:
    command: "bash scripts/generate-kotlin-bindings.sh"
    inputs:
      - "/client/src/lib/api/generated/**/*"
      - "scripts/generate-kotlin-bindings.mjs"
      - "scripts/generate-kotlin-bindings.sh"
    outputs:
      - "core/network/src/main/java/com/ferrotune/core/network/generated/**/*"
    options:
      cache: true
      runInCI: false

  # ============================================================================
  # BUILD
  # ============================================================================

  assemble-debug:
    command: "./gradlew :app:assembleDebug"
    inputs: ["@group(sources)"]
    outputs: ["app/build/outputs/apk/debug"]
    options:
      cache: true
      runInCI: false
      # Serialize Gradle invocations: concurrent Kotlin daemons in the same
      # checkout race over the shared incremental-compilation caches.
      mutex: "gradle"

  assemble-release:
    command: "./gradlew :app:assembleRelease"
    inputs: ["@group(sources)"]
    outputs: ["app/build/outputs/apk/release"]
    options:
      cache: true
      runInCI: false
      mutex: "gradle"

  test-unit:
    command: "./gradlew testDebugUnitTest"
    inputs: ["@group(sources)"]
    options:
      cache: true
      runInCI: true
      mutex: "gradle"

  # Validate suspend DTO/serializer retention in the actual R8 output on an emulator.
  test-release-contracts:
    command: "bash scripts/verify-release-contracts.sh"
    deps: ["assemble-release"]
    options:
      cache: false
      runInCI: false

  # Emulator tests for queue touch handling (the test APK is separate from the app).
  test-gestures:
    command: "bash scripts/test-gestures.sh"
    inputs: ["@group(sources)"]
    options:
      cache: false
      runInCI: false
      mutex: "gradle"

  test-cast:
    command: "bash scripts/test-cast.sh"
    inputs: ["@group(sources)"]
    options:
      cache: false
      runInCI: false
      mutex: "gradle"

  lint:
    command: "./gradlew lintDebug"
    inputs: ["@group(sources)"]
    options:
      cache: true
      runInCI: true
      mutex: "gradle"

  install-debug:
    command: "bash scripts/install-debug.sh"
    deps: ["assemble-debug"]
    options:
      cache: false
      runInCI: false

  # Minified release build signed with the local debug key (or the release key
  # via FERROTUNE_RELEASE_KEYSTORE*). Use this for real-world use and
  # performance checks; debug builds run Compose without R8 and feel slower.
  deploy:
    command: "bash scripts/deploy-release.sh"
    deps: ["assemble-release"]
    options:
      cache: false
      runInCI: false

  clean:
    command: "./gradlew clean"
    options:
      cache: false
      runInCI: false
