[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.60.1"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
fragment = "1.9.1"
appcompat = "1.8.0"
composeBom = "2026.09.00"
navigationCompose = "2.10.2"
hiltLifecycleViewmodelCompose = "1.4.0"
retrofit = "3.0.0"
okhttp = "5.5.1"
kotlinxSerialization = "1.12.0"
