[package]
name = "tauri-plugin-native-audio"
version = "0.1.0"
authors = ["Ferrotune"]
description = "Native audio playback plugin for Tauri with Android MediaSession support"
edition = "2021"
rust-version = "1.99"
license = "MIT"
links = "tauri-plugin-native-audio"

[build-dependencies]
tauri-plugin = { version = "=2.7.2", features = ["build"] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = "=2.12.5"
log = "=0.4.35"
thiserror = "=2.0.21"

[features]
default = []
